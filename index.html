<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestión - 257 Productos y Login</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-dark: #4338ca;
            --bg-color: #f3f4f6;
            --text-color: #1f2937;
            --white: #ffffff;
            --danger: #ef4444;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Pantalla de Login */
        #login-container {
            background: var(--white);
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        #login-container h2 {
            margin-bottom: 1.5rem;
            color: var(--primary);
        }

        .form-group {
            margin-bottom: 1.2rem;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 1rem;
        }

        .btn {
            background-color: var(--primary);
            color: var(--white);
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            font-weight: 600;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: var(--primary-dark);
        }

        .error-msg {
            color: var(--danger);
            font-size: 0.85rem;
            margin-top: 0.5rem;
            display: none;
        }

        /* Panel Principal (Dashboard) */
        #app-container {
            display: none;
            width: 100%;
            max-width: 1200px;
            height: 95vh;
            background: var(--white);
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            flex-direction: column;
            overflow: hidden;
            margin: 1rem;
        }

        header {
            background-color: var(--primary);
            color: var(--white);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 1.5rem;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .btn-logout {
            background-color: var(--danger);
            padding: 0.5rem 1rem;
            font-size: 0.9rem;
            width: auto;
        }

        .btn-logout:hover {
            background-color: #dc2626;
        }

        .main-content {
            padding: 2rem;
            flex: 1;
            overflow-y: auto;
        }

        .stats-bar {
            display: flex;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .stat-card {
            background: #eef2ff;
            padding: 1rem 1.5rem;
            border-radius: 8px;
            border-left: 4px solid var(--primary);
        }

        .stat-card h3 {
            font-size: 0.85rem;
            color: #4b5563;
            text-transform: uppercase;
        }

        .stat-card p {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary);
            margin-top: 0.2rem;
        }

        .table-container {
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.95rem;
        }

        th, td {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid #e5e7eb;
        }

        th {
            background-color: #f9fafb;
            font-weight: 600;
        }

        tr:hover {
            background-color: #f9fafb;
        }
    </style>
</head>

    <!-- LOGIN SCREEN -->
    <div id="login-container">
        <h2>Acceso al Sistema</h2>
        <form id="login-form" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="username">Usuario</label>
                <input type="text" id="username" required placeholder="admin">
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" required placeholder="1234">
            </div>
            <button type="submit" class="btn">Entrar</button>
            <div id="login-error" class="error-msg">Usuario o contraseña incorrectos.</div>
        </form>
    </div>

    <!-- MAIN APP SCREEN -->
    <div id="app-container">

        function handleLogin(event) {
            event.preventDefault();
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            const errorMsg = document.getElementById('login-error');

            // Credenciales de prueba: admin / 1234
            if (user === "admin" && pass === "1234") {
                document.getElementById('login-container').style.display = 'none';
                document.getElementById('app-container').style.display = 'flex';
                document.getElementById('user-display').innerText = `Usuario: ${user}`;
                loadProducts();
            } else {
                errorMsg.style.display = 'block';
            }
        }

        function handleLogout() {
            document.getElementById('app-container').style.display = 'none';
            document.getElementById('login-container').style.display = 'block';
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
            document.getElementById('login-error').style.display = 'none';
        }

        function loadProducts() {
            const tbody = document.getElementById('product-table-body');
            tbody.innerHTML = '';

            initialProducts.forEach((prod, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${index + 1}</td>
                    <td><strong>${prod.name}</strong></td>
                    <td>${prod.fam}</td>
                    <td>${prod.price.toFixed(2)} €</td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('total-count').innerText = initialProducts.length;
        }
    </script>
