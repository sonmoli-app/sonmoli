<style>
  :root{
    --bg: #121319;
    --bg-2: #191B22;
    --surface: #1E212A;
    --surface-2: #272B36;
    --line-soft: #333844;
    --amber: #E8AC4C;
    --amber-soft: #E8AC4C33;
    --amber-dim: #7A5C2C;
    --wine: #B8536E;
    --wine-soft: #B8536E22;
    --text: #F3F0E9;
    --muted: #8C90A0;
    --muted-dim: #5C6070;
    --green: #63B084;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Consolas, "Liberation Mono", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --serif: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--text); font-family:var(--sans); height:100%;}
  body{display:flex; flex-direction:column; height:100vh; overflow:hidden;}

  .glow-layer{
    position:fixed; inset:0; pointer-events:none; z-index:0; opacity:0.55;
    background:
      radial-gradient(480px 220px at 12% -8%, var(--amber-soft), transparent 60%),
      radial-gradient(420px 200px at 92% -6%, var(--wine-soft), transparent 60%);
  }

  header{
    position:relative; z-index:2;
    padding: 16px 16px 10px;
    background: linear-gradient(180deg, var(--bg-2) 0%, rgba(18,19,25,0.97) 100%);
    border-bottom: 1px solid var(--line-soft);
    flex-shrink:0;
  }
  .titlerow{ display:flex; align-items:flex-end; justify-content:space-between; gap:10px; }
  .title{
    font-family: var(--serif);
    font-size: 21px;
    letter-spacing: 0.01em;
    color: var(--text);
    margin: 0;
    line-height:1.1;
  }
  .title .accent{ color: var(--amber); font-style:italic; }
  .eyebrow{
    font-family: var(--mono); font-size: 10px; color: var(--amber);
    text-transform:uppercase; letter-spacing:0.18em; margin: 0 0 3px;
    display:flex; align-items:center; gap:6px;
  }
  .eyebrow::before{ content:""; width:14px; height:1px; background: var(--amber); display:inline-block; }
  .datebadge{
    font-family: var(--mono); font-size: 10.5px; color: var(--muted);
    text-align:right; white-space:nowrap; padding-bottom:2px;
  }

  .rule{
    height:2px; margin-top:12px; border-radius:2px;
    background: linear-gradient(90deg, var(--amber) 0%, var(--wine) 55%, transparent 100%);
    opacity:0.85;
  }

  .searchwrap{ position:relative; margin-top:12px; }
  #search{
    width:100%;
    padding: 12px 14px 12px 38px;
    border-radius: 11px;
    border: 1px solid var(--line-soft);
    background: var(--surface);
    color: var(--text);
    font-size: 16px;
    font-family: var(--sans);
    outline:none;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  #search:focus{ border-color: var(--amber); box-shadow: 0 0 0 3px var(--amber-soft); }
  .searchwrap svg{
    position:absolute; left:12px; top:50%; transform:translateY(-50%);
    width:16px; height:16px; stroke: var(--muted); pointer-events:none;
  }
  #clearSearch{
    position:absolute; right:8px; top:50%; transform:translateY(-50%);
    background:none; border:none; color:var(--muted); font-size:16px; padding:6px; display:none; cursor:pointer;
  }

  .chips{
    display:flex; gap:7px; overflow-x:auto; margin-top:11px; padding-bottom:2px;
    -ms-overflow-style: none; scrollbar-width: none;
  }
  .chips::-webkit-scrollbar{display:none;}
  .chip{
    flex-shrink:0; display:flex; align-items:center; gap:6px;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing:0.05em;
    text-transform: uppercase;
    padding: 7px 12px;
    border-radius: 999px;
    background: var(--surface);
    border: 1px solid var(--line-soft);
    color: var(--muted);
    cursor:pointer;
    white-space:nowrap;
    transition: all .15s ease;
  }
  .chip svg{ width:13px; height:13px; opacity:0.85; }
  .chip.active{ background: var(--amber); border-color: var(--amber); color: #201404; font-weight:700; }
  .chip.active svg{ opacity:1; }

  main{ position:relative; z-index:1; flex:1; overflow-y:auto; padding: 6px 12px 108px; -webkit-overflow-scrolling: touch; }

  .fam-header{
    position:sticky; top:0;
    background: var(--bg);
    padding: 16px 4px 7px;
    display:flex; align-items:center; gap:8px;
    z-index: 5;
  }
  .fam-icon{
    width:22px; height:22px; border-radius:7px; display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .fam-icon svg{ width:13px; height:13px; }
  .fam-name{
    font-family: var(--mono); font-size: 11.5px; letter-spacing: 0.1em;
    color: var(--text); text-transform: uppercase; font-weight:600;
  }
  .fam-progress{
    font-family: var(--mono); font-size: 10px; color: var(--muted-dim);
  }
  .fam-header::after{ content:""; flex:1; height:1px; background: var(--line-soft); }

  .row{
    display:flex; align-items:center; gap:10px;
    padding: 11px 8px 11px 10px;
    border-bottom: 1px solid var(--line-soft);
    border-left: 2px solid transparent;
    transition: background .15s ease, border-color .15s ease;
  }
  .row.counted{ background: rgba(99,176,132,0.08); border-left-color: var(--green); }
  .rname{ flex:1; min-width:0; font-size: 14px; line-height:1.32; color: var(--text); }
  .counter{ display:flex; align-items:center; gap:0; flex-shrink:0; }
  .cbtn{
    width:32px; height:32px; border-radius:8px; border:1px solid var(--line-soft);
    background: var(--surface-2); color: var(--text); font-size:17px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; user-select:none; transition: background .1s ease, transform .08s ease;
  }
  .cbtn:active{ background: var(--amber-dim); transform: scale(0.92); }
  .cnum{
    width: 46px; text-align:center; font-family: var(--mono); font-size:15.5px;
    background:none; border:none; color: var(--text); font-weight:700;
  }
  .cnum:focus{ outline:none; color: var(--amber); }

  .empty{ text-align:center; color:var(--muted); padding: 70px 30px 40px; font-size:13.5px; line-height:1.5; }

  footer{
    position:fixed; bottom:0; left:0; right:0; z-index:20;
    background: var(--surface);
    border-top: 1px solid var(--line-soft);
    padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
    display:flex; align-items:center; gap:8px;
    box-shadow: 0 -8px 24px rgba(0,0,0,0.25);
  }
  .stat{ font-family: var(--mono); line-height:1.15; }
  .stat .n{ font-size:16px; color:var(--amber); font-weight:700; transition: transform .12s ease; }
  .stat .n.bump{ transform: scale(1.18); }
  .stat .l{ font-size:8.5px; color:var(--muted); text-transform:uppercase; letter-spacing:0.09em; }
  .spacer{flex:1;}
  #copyBtn, #excelBtn{
    display:flex; align-items:center; gap:6px;
    border:none; border-radius:10px;
    padding: 10px 13px; font-size:12.5px; font-weight:700; cursor:pointer;
    font-family: var(--sans); white-space:nowrap;
    transition: transform .08s ease, background .15s ease;
  }
  #copyBtn:active, #excelBtn:active{ transform: scale(0.96); }
  #copyBtn svg, #excelBtn svg{ width:14px; height:14px; }
  #copyBtn{ background: var(--surface-2); color: var(--text); border:1px solid var(--line-soft); }
  #excelBtn{ background: var(--green); color:#0A1F13; }
  #copyBtn.copied{ background: var(--green); color:#0A1F13; }
  #excelBtn.done{ background: var(--amber); color:#201404; }
</style>
</head>

  if(['GIN','VODKA','RON','WHISKY','TEQUILA','BRANDY','VERMOUTH','LICOR'].includes(fam)) return 'bottle';
  if(fam === 'CERVEZA') return 'mug';
  if(['AGUA','ZUMO','SIROPE'].includes(fam)) return 'drop';
  if(fam === 'REFRESCO') return 'can';
  if(fam === 'CAFÉ') return 'cup';
  return 'box';
};

const FAM_COLORS = {};
const PALETTE = ['#B8536E','#5A85AC','#E8AC4C','#63B084','#9678BE','#D18A56','#579C9F','#C4708E','#8A9968','#D6B25A'];
let ci = 0;
ITEMS.forEach(it => {
  if(!(it.f in FAM_COLORS)){ FAM_COLORS[it.f] = PALETTE[ci % PALETTE.length]; ci++; }
});

const counts = {};
ITEMS.forEach((it,i)=> counts[i] = null);

const DECIMAL_FAMS = new Set([
  'VINO BLANCO','VINO ROSADO','VINO TINTO','VINO GENEROSO','CAVA',
  'GIN','VODKA','RON','WHISKY','TEQUILA','BRANDY','VERMOUTH','LICOR'
]);
function stepFor(fam){ return DECIMAL_FAMS.has(fam) ? 0.1 : 1; }
function roundQty(v, fam){
  if(DECIMAL_FAMS.has(fam)) return Math.round(v * 10) / 10;
  return Math.round(v);
}
function fmtQty(v, fam){
  if(v === null || v === undefined || v === '') return '';
  return DECIMAL_FAMS.has(fam) ? v.toFixed(1) : String(v);
}

const SECTIONS = ['BEBIDAS','COCINA','MINIBAR'];
const SECTION_ICON = {'BEBIDAS':'bottle','COCINA':'cup','MINIBAR':'box'};
let activeSection = 'BEBIDAS';
let searchTerm = '';

const chipsEl = document.getElementById('chips');
const listEl = document.getElementById('list');
const searchEl = document.getElementById('search');
const clearBtn = document.getElementById('clearSearch');
const countedNEl = document.getElementById('countedN');
const totalEurEl = document.getElementById('totalEur');
const copyBtn = document.getElementById('copyBtn');
const dateBadge = document.getElementById('dateBadge');

(function initDate(){
  const d = new Date();
  const meses = ['ENE','FEB','MAR','ABR','MAY','JUN','JUL','AGO','SEP','OCT','NOV','DIC'];
  dateBadge.textContent = `${d.getDate()} ${meses[d.getMonth()]} ${d.getFullYear()}`;
})();

function renderChips(){
  chipsEl.innerHTML = '';
  SECTIONS.forEach(s=>{
    const chip = document.createElement('div');
    chip.className = 'chip' + (s===activeSection && !searchTerm ? ' active' : '');
    chip.innerHTML = ICONS[SECTION_ICON[s]] + `<span>${s}</span>`;
    chip.onclick = ()=>{ activeSection = s; searchEl.value=''; searchTerm=''; clearBtn.style.display='none'; render(); };
    chipsEl.appendChild(chip);
  });
}

function fmtMoney(v){
  return v.toLocaleString('es-ES', {minimumFractionDigits:2, maximumFractionDigits:2}) + ' €';
}

function render(){
  renderChips();
  let filtered = ITEMS.map((it,i)=>({...it, idx:i}));
  if(searchTerm){
    const t = searchTerm.toLowerCase();
    filtered = filtered.filter(it => it.p.toLowerCase().includes(t));
  } else {
    filtered = filtered.filter(it => it.s === activeSection);
  }

  listEl.innerHTML = '';
  if(filtered.length === 0){
    listEl.innerHTML = `<div class="empty">${ICONS.glass}<div>Sin resultados. Prueba con otra palabra.</div></div>`;
    updateFooter();
    return;
  }

  let lastFam = null;
  filtered.forEach(it=>{
    if(it.f !== lastFam){
      lastFam = it.f;
      const famItems = filtered.filter(x=>x.f===it.f && (searchTerm || x.s===activeSection));
      const famDone = famItems.filter(x=>counts[x.idx]).length;
      const color = FAM_COLORS[it.f];
      const fh = document.createElement('div');
      fh.className = 'fam-header';
      fh.innerHTML = `
        <div class="fam-icon" style="background:${color}22; color:${color};">${ICONS[FAM_ICON_KEY(it.f)]}</div>
        <span class="fam-name">${it.f}</span>
        <span class="fam-progress">${famDone}/${famItems.length}</span>
      `;
      listEl.appendChild(fh);
    }
    const row = document.createElement('div');
    row.className = 'row' + (counts[it.idx] ? ' counted' : '');
    const step = stepFor(it.f);
    row.innerHTML = `
      <div class="rname">${it.p}</div>
      <div class="counter">
        <div class="cbtn" data-act="minus" data-idx="${it.idx}">−</div>
        <input class="cnum" type="number" step="${step}" inputmode="decimal" data-idx="${it.idx}" value="${fmtQty(counts[it.idx], it.f)}" placeholder="0">
        <div class="cbtn" data-act="plus" data-idx="${it.idx}">+</div>
      </div>
    `;
    listEl.appendChild(row);
  });
  updateFooter();
}

listEl.addEventListener('click', (e)=>{
  const btn = e.target.closest('.cbtn');
  if(!btn) return;
  const idx = parseInt(btn.dataset.idx);
  const fam = ITEMS[idx].f;
  const step = stepFor(fam);
  let cur = counts[idx] || 0;
  cur = btn.dataset.act === 'plus' ? cur + step : Math.max(0, cur - step);
  counts[idx] = roundQty(cur, fam);
  render();
});

listEl.addEventListener('input', (e)=>{
  if(!e.target.classList.contains('cnum')) return;
  const idx = parseInt(e.target.dataset.idx);
  const fam = ITEMS[idx].f;
  const val = e.target.value;
  counts[idx] = val === '' ? null : roundQty(parseFloat(val), fam);
  const row = e.target.closest('.row');
  if(row) row.classList.toggle('counted', !!counts[idx]);
  updateFooter();
});

function bump(el){
  el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump');
}

function updateFooter(){
  let n = 0, total = 0;
  ITEMS.forEach((it,i)=>{
    const q = counts[i];
    if(q){ n++; total += q * (it.pr || 0); }
  });
  if(countedNEl.textContent !== String(n)) bump(countedNEl);
  countedNEl.textContent = n;
  totalEurEl.textContent = fmtMoney(total);
}

searchEl.addEventListener('input', (e)=>{
  searchTerm = e.target.value;
  clearBtn.style.display = searchTerm ? 'block' : 'none';
  render();
});
clearBtn.addEventListener('click', ()=>{
  searchEl.value=''; searchTerm=''; clearBtn.style.display='none'; render();
});

copyBtn.addEventListener('click', ()=>{
  let lines = ['PRODUCTO\tFAMILIA\tUD\tVALOR'];
  ITEMS.forEach((it,i)=>{
    const q = counts[i];
    if(q){ lines.push(`${it.p}\t${it.f}\t${fmtQty(q, it.f)}\t${(q*(it.pr||0)).toFixed(2)}`); }
  });
  const text = lines.join('\n');
  const done = ()=>{
    copyBtn.innerHTML = '✓ Copiado';
    copyBtn.classList.add('copied');
    setTimeout(()=>{ copyBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg> Copiar'; copyBtn.classList.remove('copied'); }, 1800);
  };
  if(navigator.clipboard){
    navigator.clipboard.writeText(text).then(done);
  } else {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    done();
  }
});

const excelBtn = document.getElementById('excelBtn');
const SECTION_SHEETNAME = {
  'BEBIDAS': 'BEBIDAS (conteo rápido)',
  'COCINA': 'COCINA (conteo rápido)',
  'MINIBAR': 'MINIBAR (conteo rápido)'
};

function buildSheetAOA(sectionItems){
  const aoa = [];
  const merges = [];
  let lastFam = null;
  let prodStartRow = null;
  let prodEndRow = null;
  const subtotalRows = [];

  function closeFamily(){
    if(lastFam === null) return;
    aoa.push([`SUBTOTAL ${lastFam}`, '', '', {f: `SUM(D${prodStartRow}:D${prodEndRow})`}]);
    subtotalRows.push(aoa.length);
    aoa.push([]);
  }

  sectionItems.forEach((it)=>{
    if(it.f !== lastFam){
      closeFamily();
      aoa.push([it.f, '', '', '']);
      merges.push({s:{r:aoa.length-1, c:0}, e:{r:aoa.length-1, c:3}});
      aoa.push(['PRODUCTO','UD','PRECIO','VALOR TOTAL']);
      lastFam = it.f;
      prodStartRow = null;
    }
    const q = counts[it.idx];
    const qVal = q ? q : '';
    aoa.push([it.p, qVal, it.pr || 0, '']);
    const thisRow = aoa.length;
    if(qVal !== ''){
      aoa[thisRow-1][3] = {f:`B${thisRow}*C${thisRow}`};
    }
    if(prodStartRow === null) prodStartRow = thisRow;
    prodEndRow = thisRow;
  });
  closeFamily();

  aoa.push([]);
  aoa.push(['TOTAL', '', '', subtotalRows.length ? {f: subtotalRows.map(r=>`D${r}`).join('+')} : 0]);

  return {aoa, merges};
}

excelBtn.addEventListener('click', ()=>{
  const wb = XLSX.utils.book_new();
  ['BEBIDAS','COCINA','MINIBAR'].forEach(sec=>{
    const secItems = ITEMS.map((it,idx)=>({...it, idx})).filter(it => it.s === sec);
    const {aoa, merges} = buildSheetAOA(secItems);
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    ws['!merges'] = merges;
    ws['!cols'] = [{wch:42},{wch:10},{wch:10},{wch:12}];
    XLSX.utils.book_append_sheet(wb, ws, SECTION_SHEETNAME[sec]);
  });
  const today = new Date();
  const stamp = today.toISOString().slice(0,10);
  XLSX.writeFile(wb, `Inventario contado ${stamp}.xlsx`);
  excelBtn.innerHTML = '✓ Listo';
  excelBtn.classList.add('done');
  setTimeout(()=>{ excelBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v13m0 0l-4-4m4 4l4-4"/><path d="M5 20h14"/></svg> Excel'; excelBtn.classList.remove('done'); }, 1800);
});

render();
</script>
</body>
</html>
