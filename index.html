<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Inventario — Son Molí</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root {
    --bg: #121319;
    --bg-2: #191B22;
    --surface: #1E212A;
    --surface-2: #272B36;
    --line-soft: #333844;
    --amber: #E8AC4C;
    --amber-soft: #E8AC4C22;
    --green: #63B084;
    --green-soft: #63B08422;
    --wine: #B8536E;
    --text: #F3F0E9;
    --muted: #8C90A0;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --serif: Georgia, serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--text); font-family:var(--sans); height:100%;}
  body{display:flex; flex-direction:column; height:100vh; overflow:hidden;}

  header{
    position:relative; z-index:2;
    padding: 16px 16px 10px;
    background: linear-gradient(180deg, var(--bg-2) 0%, rgba(18,19,25,0.97) 100%);
    border-bottom: 1px solid var(--line-soft);
    flex-shrink:0;
  }
  .titlerow{ display:flex; align-items:flex-end; justify-content:space-between; gap:10px; }
  .title{ font-family: var(--serif); font-size: 21px; color: var(--text); margin: 0; line-height:1.1; }
  .title .accent{ color: var(--amber); font-style:italic; }
  .eyebrow{
    font-family: var(--mono); font-size: 10px; color: var(--amber);
    text-transform:uppercase; letter-spacing:0.18em; margin: 0 0 3px;
    display:flex; align-items:center; gap:6px;
  }
  .eyebrow::before{ content:""; width:14px; height:1px; background: var(--amber); display:inline-block; }
  .datebadge{ font-family: var(--mono); font-size: 10.5px; color: var(--muted); text-align:right; }

  .searchwrap{ position:relative; margin-top:12px; }
  #search{
    width:100%; padding: 10px 14px 10px 36px; border-radius: 10px;
    border: 1px solid var(--line-soft); background: var(--surface);
    color: var(--text); font-size: 15px; outline:none;
  }
  #search:focus{ border-color: var(--amber); }
  .searchwrap svg{ position:absolute; left:12px; top:50%; transform:translateY(-50%); width:15px; height:15px; stroke: var(--muted); }

  .tabs{ display:flex; gap:6px; margin-top:12px; overflow-x:auto; padding-bottom:2px; }
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex:1; text-align:center; padding: 8px 12px; border-radius: 8px;
    background: var(--surface); border: 1px solid var(--line-soft);
    color: var(--muted); font-size: 12px; font-weight:600; cursor:pointer;
    white-space:nowrap; transition: all .15s ease;
  }
  .tab.active{ background: var(--amber); border-color: var(--amber); color: #121319; font-weight:700; }

  main{ position:relative; z-index:1; flex:1; overflow-y:auto; padding: 12px 14px 108px; -webkit-overflow-scrolling: touch; }

  .card-grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap:10px; }
  .card{
    background: var(--surface); border: 1px solid var(--line-soft);
    border-radius: 12px; padding: 12px; display:flex; flex-direction:column;
    justify-content:space-between; position:relative;
  }
  .card.has-val{ border-color: var(--amber); background: var(--amber-soft); }
  .card-title{ font-size: 13px; font-weight:600; color: var(--text); margin-bottom: 8px; line-height:1.2; }
  .card-fam{ font-size: 10px; font-family: var(--mono); color: var(--muted); text-transform:uppercase; margin-bottom: 10px; }
  .card-controls{ display:flex; align-items:center; justify-content:space-between; margin-top:auto; }
  
  .btn-qty{
    width:30px; height:30px; border-radius:6px; border:1px solid var(--line-soft);
    background: var(--surface-2); color: var(--text); font-size:16px;
    display:flex; align-items:center; justify-content:center; cursor:pointer; user-select:none;
  }
  .btn-qty:active{ background: var(--amber); color:#000; }
  .input-qty{
    width:42px; text-align:center; font-family: var(--mono); font-size:14px;
    background:none; border:none; color: var(--text); font-weight:700;
  }
  .input-qty:focus{ outline:none; color: var(--amber); }

  footer{
    position:fixed; bottom:0; left:0; right:0; z-index:20;
    background: var(--surface); border-top: 1px solid var(--line-soft);
    padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
    display:flex; align-items:center; gap:8px;
  }
  .stat{ font-family: var(--mono); }
  .stat .n{ font-size:16px; color:var(--amber); font-weight:700; }
  .stat .l{ font-size:9px; color:var(--muted); text-transform:uppercase; }
  .spacer{ flex:1; }
  
  .action-btn{
    display:flex; align-items:center; gap:6px; border:none; border-radius:8px;
    padding: 10px 12px; font-size:12px; font-weight:700; cursor:pointer;
  }
  #excelBtn{ background: var(--green); color:#0A1F13; }
  #copyBtn{ background: var(--surface-2); color: var(--text); border:1px solid var(--line-soft); }
</style>
</head>
<body>

<header>
  <div class="titlerow">
    <div>
      <p class="eyebrow">Gestión de Stock</p>
      <h1 class="title">Inventario <span class="accent">Son Molí</span></h1>
    </div>
    <div class="datebadge" id="dateBadge"></div>
  </div>
  <div class="searchwrap">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <input id="search" type="text" placeholder="Buscar producto…" autocomplete="off">
  </div>
  <div class="tabs">
    <div class="tab active" onclick="switchTab('BEBIDAS')">Bar</div>
    <div class="tab" onclick="switchTab('MINIBAR')">Minibar</div>
    <div class="tab" onclick="switchTab('COCINA')">Cocina</div>
  </div>
</header>

<main>
  <div class="card-grid" id="grid"></div>
</main>

<footer>
  <div class="stat"><div class="n" id="countedN">0</div><div class="l">contados</div></div>
  <div class="spacer"></div>
  <button class="action-btn" id="excelBtn" onclick="exportExcel()">Excel</button>
  <button class="action-btn" id="copyBtn" onclick="copyData()">Copiar</button>
</footer>

<script>
const ITEMS = [
  {"p": "6435, ALHAMBRA RESERVA 1925 33CL", "f": "CERVEZA", "pr": 1.87, "s": "BEBIDAS"},
  {"p": "PRD0000617 ALHAMBRA RESERVA 1925 33CL", "f": "CERVEZA", "pr": 1.18, "s": "BEBIDAS"},
  {"p": "EC13, DAURA DAMM 1/3 RET. CAJ.", "f": "CERVEZA", "pr": 1.507, "s": "BEBIDAS"},
  {"p": "ED13 ESTRELLA DAMM 1/3RET.pp", "f": "CERVEZA", "pr": 1.4, "s": "BEBIDAS"},
  {"p": "PRD0005393, MAHOU 0/0 TOSTADA 33 CL", "f": "CERVEZA", "pr": 1.03, "s": "BEBIDAS"},
  {"p": "110450, ROSA BLANCA 1/3 RET C/24", "f": "CERVEZA", "pr": 1.52, "s": "BEBIDAS"},
  {"p": "3076 FRANZISKANER WEISSBIER", "f": "CERVEZA", "pr": 1.73, "s": "BEBIDAS"},
  {"p": "3074 FRANZISKANER WEISSBIER 00", "f": "CERVEZA", "pr": 1.7, "s": "BEBIDAS"},
  {"p": "544 -2, COCA COLA ZERO VR237", "f": "REFRESCO", "pr": 0.706, "s": "BEBIDAS"},
  {"p": "NESTEA CJ 24 UD", "f": "REFRESCO", "pr": 0.97, "s": "BEBIDAS"},
  {"p": "1080 COCA COLA LATA 33", "f": "REFRESCO", "pr": 1.61, "s": "BEBIDAS"},
  {"p": "544, COCA COLA VR237", "f": "REFRESCO", "pr": 0.74, "s": "BEBIDAS"},
  {"p": "534, FANTA LIM VR237", "f": "REFRESCO", "pr": 0.63, "s": "BEBIDAS"},
  {"p": "524, FANTA NARANJA VR237", "f": "REFRESCO", "pr": 0.63, "s": "BEBIDAS"},
  {"p": "RBLISS LEM MIXER VR20", "f": "REFRESCO", "pr": 1.33, "s": "BEBIDAS"},
  {"p": "RBLISS SIG TON WTR VR20", "f": "REFRESCO", "pr": 1.33, "s": "BEBIDAS"},
  {"p": "2548, SPRITE VR20 C24 UN", "f": "REFRESCO", "pr": 0.58, "s": "BEBIDAS"},
  {"p": "00008109, ALBARIÑO PUERTA SANTA", "f": "VINO BLANCO", "pr": 7.7, "s": "BEBIDAS"},
  {"p": "PEDRO ESCUDERO SAUVIGNON", "f": "VINO BLANCO", "pr": 6.95, "s": "BEBIDAS"},
  {"p": "PEDRO ESCUDERO VERDEJO", "f": "VINO BLANCO", "pr": 6.95, "s": "BEBIDAS"},
  {"p": "00001285 ARMERO ADROVER FINCA ROS", "f": "VINO ROSADO", "pr": 15.35, "s": "BEBIDAS"},
  {"p": "00754, CORIMBO 2019", "f": "VINO TINTO", "pr": 18.71, "s": "BEBIDAS"},
  {"p": "00001062, RIBAS SIO NEGRE 2022", "f": "VINO TINTO", "pr": 17.07, "s": "BEBIDAS"},
  {"p": "00048010 BOMBAY SAPHIRE", "f": "GIN", "pr": 14.73, "s": "BEBIDAS"},
  {"p": "MONKEY 47 0.50", "f": "GIN", "pr": 30.41, "s": "BEBIDAS"},
  {"p": "00048013, GIN HENDRICK'S 70 CL", "f": "GIN", "pr": 25.35, "s": "BEBIDAS"},
  {"p": "200238, GIN MARE 70 CL", "f": "GIN", "pr": 29.3, "s": "BEBIDAS"},
  {"p": "200450, GIN PALMA 70 CL", "f": "GIN", "pr": 30.37, "s": "BEBIDAS"},
  {"p": "51005 ABSOLUT AZUL", "f": "VODKA", "pr": 12.35, "s": "BEBIDAS"},
  {"p": "00051013, VODKA GREY GOOSE 1 L", "f": "VODKA", "pr": 35.22, "s": "BEBIDAS"},
  {"p": "00050125 , RON ZACAPA 23 AÑOS", "f": "RON", "pr": 44.66, "s": "BEBIDAS"},
  {"p": "00050080 RON HAVANA CLUB 7 AÑOS", "f": "RON", "pr": 19.83, "s": "BEBIDAS"},
  {"p": "00053027 WHISKY JACK DANIELS", "f": "WHISKY", "pr": 24.2, "s": "BEBIDAS"},
  {"p": "00054039, JOHNNIE WALKER BLACK", "f": "WHISKY", "pr": 22.83, "s": "BEBIDAS"},
  {"p": "200170, COGNAC REMY MARTIN VSOP", "f": "BRANDY", "pr": 21.00, "s": "BEBIDAS"},
  {"p": "PALO", "f": "LICOR", "pr": 13.10, "s": "BEBIDAS"},
  {"p": "HELADO HAAGEN D", "f": "HELADOS", "pr": 1.90, "s": "COCINA"},
  {"p": "CAFÉ MUTANTE INTENSI 1KG", "f": "COCINA", "pr": 18.4, "s": "COCINA"},
  {"p": "PRINGLES ORIGINAL", "f": "MINIBAR", "pr": 0.69, "s": "MINIBAR"},
  {"p": "KIT KAT", "f": "MINIBAR", "pr": 0.68, "s": "MINIBAR"},
  {"p": "HARIBO", "f": "MINIBAR", "pr": 0.52, "s": "MINIBAR"},
  {"p": "COKE", "f": "MINIBAR", "pr": 0.79, "s": "MINIBAR"},
  {"p": "COKE ZERO", "f": "MINIBAR", "pr": 0.79, "s": "MINIBAR"},
  {"p": "CERVEZA ROSA BLANCA", "f": "MINIBAR", "pr": 0.76, "s": "MINIBAR"}
];

let counts = {};
ITEMS.forEach((_, i) => counts[i] = '');

let activeTab = 'BEBIDAS';
let searchFilter = '';

const grid = document.getElementById('grid');

function render() {
  grid.innerHTML = '';
  let filtered = ITEMS.map((it, idx) => ({...it, idx}))
    .filter(it => it.s === activeTab);

  if (searchFilter) {
    const t = searchFilter.toLowerCase();
    filtered = filtered.filter(it => it.p.toLowerCase().includes(t));
  }

  filtered.forEach(it => {
    const card = document.createElement('div');
    const hasVal = counts[it.idx] !== '' && counts[it.idx] > 0;
    card.className = 'card' + (hasVal ? ' has-val' : '');
    card.innerHTML = `
      <div>
        <div class="card-fam">${it.f}</div>
        <div class="card-title">${it.p}</div>
      </div>
      <div class="card-controls">
        <div class="btn-qty" onclick="changeQty(${it.idx}, -1)">−</div>
        <input class="input-qty" type="number" data-idx="${it.idx}" value="${counts[it.idx]}" placeholder="0" oninput="onInputQty(event, ${it.idx})">
        <div class="btn-qty" onclick="changeQty(${it.idx}, 1)">+</div>
      </div>
    `;
    grid.appendChild(card);
  });
  updateFooter();
}

function switchTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('active', t.innerText.toUpperCase().includes(tab));
  });
  render();
}

function changeQty(idx, delta) {
  let val = parseFloat(counts[idx]) || 0;
  val = Math.max(0, val + delta);
  counts[idx] = val === 0 ? '' : val;
  render();
}

function onInputQty(e, idx) {
  const val = e.target.value;
  counts[idx] = val === '' ? '' : Math.max(0, parseFloat(val));
  updateFooter();
}

function updateFooter() {
  let count = 0;
  Object.values(counts).forEach(v => {
    if (v !== '' && v > 0) count++;
  });
  document.getElementById('countedN').innerText = count;
}

document.getElementById('search').addEventListener('input', (e) => {
  searchFilter = e.target.value;
  render();
});

function copyData() {
  let text = "PRODUCTO\tCANTIDAD\n";
  ITEMS.forEach((it, i) => {
    if (counts[i] !== '' && counts[i] > 0) {
      text += `${it.p}\t${counts[i]}\n`;
    }
  });
  navigator.clipboard.writeText(text).then(() => alert("Copiado al portapapeles"));
}

function exportExcel() {
  const data = [["Producto", "Familia", "Cantidad", "Precio", "Total"]];
  ITEMS.forEach((it, i) => {
    if (counts[i] !== '' && counts[i] > 0) {
      data.push([it.p, it.f, counts[i], it.pr, counts[i] * it.pr]);
    }
  });
  const ws = XLSX.utils.aoa_to_sheet(data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Inventario");
  XLSX.writeFile(wb, "Inventario_Son_Moli.xlsx");
}

(function initDate(){
  const d = new Date();
  const meses = ['ENE','FEB','MAR','ABR','MAY','JUN','JUL','AGO','SEP','OCT','NOV','DIC'];
  document.getElementById('dateBadge').textContent = `${d.getDate()} ${meses[d.getMonth()]} ${d.getFullYear()}`;
})();

render();
</script>
</body>
</html>
